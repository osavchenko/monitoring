apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
    name: my-node-app-cpu-alerts
    labels:
        release: monitoring
spec:
    groups:
        - name: my-node-app.cpu
          rules:
              - alert: HostHighCPUUsage
                expr: |
                    100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 80
                for: 2m
                labels:
                    severity: warning
                annotations:
                    summary: "High CPU usage on {{ $labels.instance }}"
                    description: >-
                        CPU usage on {{ $labels.instance }} has been above 80% for
                        more than 2 minutes (current value: {{ $value | printf "%.1f" }}%).
