apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-log-exporter-config
data:
  prometheus-nginxlog-exporter.hcl: |
      listen {
        port = 4040
      }
      
      namespace "nginx" {
        # Must match the "main" log_format defined in nginx.conf
        format = "$remote_addr - $remote_user [$time_local] \"$request\" $status $body_bytes_sent \"$http_referer\" \"$http_user_agent\" \"$http_x_forwarded_for\""
        source_files = [
          "/var/log/nginx/access.log"
        ]
      }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-node-app
  labels:
    app: my-node-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-node-app
  template:
    metadata:
      labels:
        app: my-node-app
    spec:
      containers:
        - name: my-node-app
          image: my-node-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80     # nginx (the web app)
            - name: metrics
              containerPort: 9100   # prometheus-node-exporter /metrics
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx

        - name: nginx-log-exporter
          image: quay.io/martinhelmich/prometheus-nginxlog-exporter:v1.9.2
          args:
            - "-config-file"
            - "/etc/prometheus-nginxlog-exporter.hcl"
          ports:
            - name: nginxlog
              containerPort: 4040   # nginx-log-exporter /metrics (status-code breakdown)
          volumeMounts:
            - name: nginx-logs
              mountPath: /var/log/nginx
              readOnly: true
            - name: nginxlog-exporter-config
              mountPath: /etc/prometheus-nginxlog-exporter.hcl
              subPath: prometheus-nginxlog-exporter.hcl

      volumes:
        - name: nginx-logs
          emptyDir: {}
        - name: nginxlog-exporter-config
          configMap:
            name: nginx-log-exporter-config
---
apiVersion: v1
kind: Service
metadata:
  name: my-node-app
  labels:
    app: my-node-app
spec:
  selector:
    app: my-node-app
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
    - name: nginxlog
      port: 4040
      targetPort: nginxlog
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-node-app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: my-node-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
    - port: nginxlog
      path: /metrics
      interval: 30s