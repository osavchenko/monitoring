apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-node-app
  labels:
    app: my-node-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-node-app
  template:
    metadata:
      labels:
        app: my-node-app
    spec:
      containers:
        - name: my-node-app
          image: my-node-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80     # nginx (the web app)
            - name: metrics
              containerPort: 9100   # prometheus-node-exporter /metrics
---
apiVersion: v1
kind: Service
metadata:
  name: my-node-app
  labels:
    app: my-node-app
spec:
  selector:
    app: my-node-app
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-node-app
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: my-node-app
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
