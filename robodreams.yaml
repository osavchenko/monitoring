apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
    name: robodreams-probe
    namespace: monitoring
spec:
    module: http_2xx
    prober:
        url: blackbox-exporter-prometheus-blackbox-exporter.monitoring.svc:9115
    targets:
        staticConfig:
            static:
                - https://robotdreams.cc
    interval: 30s
